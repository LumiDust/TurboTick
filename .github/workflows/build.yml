name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $modVersion = ([xml](Get-Content About/About.xml -Raw)).ModMetaData.modVersion
          if ($version -ne $modVersion) { throw 'Mod and repository versions differ.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and source version differ.' }
          $channel = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.ReleaseChannel
          if ($channel -notin @('stable', 'preview')) { throw 'ReleaseChannel must be stable or preview.' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build, protocol tests, installer tests and runtime packages
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload runtime packages
        uses: actions/upload-artifact@v4
        with:
          name: TurboTick-${{ steps.version.outputs.value }}-rimworld-1.7
          path: |
            artifacts/TurboTick-${{ steps.version.outputs.value }}-mod-1.7.zip
            artifacts/TurboTick-${{ steps.version.outputs.value }}-coordinator-linux-x64
            artifacts/TurboTick-${{ steps.version.outputs.value }}-headless-installer.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  headless-container:
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TurboTick-${{ needs.build-test-package.outputs.version }}-rimworld-1.7
          path: artifacts/runtime-packages
      - name: Prepare the exact client release bytes for the image
        shell: bash
        env:
          VERSION: ${{ needs.build-test-package.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts/runtime-packages
          # SHA256SUMS also covers the coordinator binary, which this job does not download: the image only
          # needs the mod bytes. Verify everything that is present and ignore the rest.
          sha256sum -c SHA256SUMS --ignore-missing
          cd ../..
          mkdir -p artifacts/container-mod
          unzip -q "artifacts/runtime-packages/TurboTick-$VERSION-mod-1.7.zip" -d artifacts/container-mod
          test -f artifacts/container-mod/TurboTick/1.7/Assemblies/TurboTick.dll
          test "$(find artifacts/container-mod -name '*.dll' | wc -l)" -eq 3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 headless image without game or credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: turbotick-headless:ci
          build-args: |
            VERSION=${{ needs.build-test-package.outputs.version }}
            TURBOTICK_MOD_VERSION=${{ needs.build-test-package.outputs.version }}
          cache-from: type=gha,scope=headless
          cache-to: type=gha,mode=max,scope=headless
      - name: Container entrypoint and persistence contract tests
        shell: bash
        run: bash scripts/test-container.sh turbotick-headless:ci
      - name: Validate Compose configuration
        shell: bash
        run: docker compose config --quiet
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/turbotick-headless
          tags: |
            type=raw,value=${{ needs.build-test-package.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && needs.build-test-package.outputs.channel == 'stable' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.version=${{ needs.build-test-package.outputs.version }}
      - name: Publish the tested headless image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ needs.build-test-package.outputs.version }}
            TURBOTICK_MOD_VERSION=${{ needs.build-test-package.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=headless
          cache-to: type=gha,mode=max,scope=headless

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test-package, headless-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TurboTick-${{ needs.build-test-package.outputs.version }}-rimworld-1.7
          path: artifacts
      - name: Publish GitHub release after package and image tests
        uses: softprops/action-gh-release@v2
        with:
          name: TurboTick ${{ needs.build-test-package.outputs.version }}
          draft: false
          prerelease: ${{ needs.build-test-package.outputs.channel == 'preview' }}
          make_latest: ${{ needs.build-test-package.outputs.channel == 'stable' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/TurboTick-${{ needs.build-test-package.outputs.version }}-mod-1.7.zip
            artifacts/TurboTick-${{ needs.build-test-package.outputs.version }}-coordinator-linux-x64
            artifacts/TurboTick-${{ needs.build-test-package.outputs.version }}-headless-installer.zip
            artifacts/SHA256SUMS
          body: |
            ## 协调器专服

            - 专服不再模拟殖民地：每个玩家在本地完整模拟，动画与寻路原生正确，需要同步的份数从 N+1 回到 N。
            - 专服改为自包含单文件，**不再需要安装 RimWorld**，也不再加载游戏程序集。
            - `deploy/turbotick-coordinator.service` 是可直接使用的 systemd 单元。

            ## 命令路径修复

            - lockstep 房间把命令回显给发起者。原先跳过发起者，导致按按钮的人反而是唯一不执行自己命令的人，两端在小人位置上迅速分开。
            - 命令改盖在所有 peer 都尚未到达的 tick，避免落在已被执行过的过去而被序号规则当作回退丢弃。
            - 服务端命令白名单补上 `thing-state`；此前通用 gizmo 同步的每条命令都被当作 `UnknownCommand` 丢弃，功能从未生效。

            ## 确定性

            - 把剩余的按帧模拟工作钉到 tick：天气、活动区、MapComponent、WorldComponent、GameComponent。
            - 共享世界强制关闭「快速生态」开发选项（每 tick 前进 2000，会直接破坏时间线）。
            - 不再让 GameComponent 闸门停掉 TurboTick 自己的组件——那是处理网络消息的泵。

            ## 节拍与恢复

            - 加入者的进度按将载入的检查点播种，规范化重载时回拨所有 peer 的进度，消除每秒数百 tick 的快进重放。
            - 有人加入时全体从同一检查点重载，让长期运行的进程与刚反序列化的进程从同一加载点开始。
            - 分叉时先暂停并指出字段（位置／血量／工作／物体／标记／随机流），而不是静默回滚。
            - 暂停时保持 Playing：Faulted 会拒绝输入，原先「先留在这里」等于把玩家锁在一个仍在推进的世界外面。

            ## 验证

            两台互不相关的 headless 客户端、同一份游戏与 Mod 字节：

            - 无输入 14 900 tick、脚本化操作 345 次 20 000+ tick，均为零分叉。
            - 晚加入间隔 152 秒：仅一次规范化重载，之后零分叉。
            - 断线重连：零分叉至 31 200 tick。
            - 房主退出：剩余玩家继续推进并接管房主。
            - 63 条整对象 Scribe 状态走完采样→下发→应用，零分叉。
            - 单元测试 62 项、网络协议测试 29 组全绿。

            已确认的限制：真实点击事件到 gizmo 委托这一跳无法自动化；第三方 Mod 若使用 `UnityEngine.Random` 无法被确定化。

            ## 下载

            - `mod-1.7.zip`：所有玩家使用，必须与专服同版本（0.6.1 / 协议 v5）。
            - `coordinator-linux-x64`：专服，自包含单文件，目标机只需 x64 Linux。
            - `headless-installer.zip`：0.6.0 的 headless 游戏托管部署，仅用于回退。
            - `SHA256SUMS`：全部运行包的校验值。


            RimWorld 1.7；TurboTick ${{ needs.build-test-package.outputs.version }}；协议 v4。所有参与端更新为同一份包，并保持完整游戏 build、DLC、模组顺序及配置一致。历史 0.5.1 及更早附件与旧镜像保留用于回退，不再发布新的 `server.zip`。

            [安装与使用](https://github.com/LumiDust/TurboTick#readme) · [详细服务器部署](https://github.com/LumiDust/TurboTick/blob/main/deploy/README.md)
